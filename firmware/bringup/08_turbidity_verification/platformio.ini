; =================================================================
; AquaSentinel-AI: Isolated Hardware Bring-Up Phase
; Stage 08: Turbidity Sensor Hardware Verification (Isolated)
; =================================================================
; Target Board: NodeMCU ESP-32S / ESP32 Dev Module (38-pin)
; Serial Port : COM3 (Silicon Labs CP210x USB-UART)
; ADC Input   : GPIO34 / P34 (via 33k/22k divider, 0.4x ratio)
; =================================================================

[env:turbidity_verification]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Ports are not fixed: pass --upload-port COMx / --port COMx (see docs/LAPTOP_SETUP.md)

build_flags =
    -D CORE_DEBUG_LEVEL=0
