; =================================================================
; AquaSentinel-AI: Isolated Hardware Bring-Up Phase
; Stage 04: DS18B20 Temperature Sensor Verification (GPIO P33)
; =================================================================
; Isolated, self-contained PlatformIO project for hardware bring-up.
; Target Board: NodeMCU ESP-32S (38-pin Dev Module)
; Serial Port : COM3 (Silicon Labs CP2102 USB-UART)
; =================================================================

[env:ds18b20_verification]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

upload_port = COM3
monitor_port = COM3

build_flags =
    -D CORE_DEBUG_LEVEL=0

lib_deps =
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.9.0
