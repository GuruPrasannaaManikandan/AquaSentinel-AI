; PlatformIO Configuration for Isolated OV2640 Camera Hardware Verification
; Environment: AI-Thinker ESP32-CAM via ESP32-CAM-MB Programmer (CH340)

[platformio]
src_dir = .

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Ports are not fixed: pass --upload-port COMx / --port COMx (see docs/LAPTOP_SETUP.md)

upload_protocol = esptool

board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
