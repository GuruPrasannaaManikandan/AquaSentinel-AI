; PlatformIO Project Configuration for ESP32-CAM Isolated Hardware Bring-Up
; Environment: AI-Thinker ESP32-CAM on ESP32-CAM-MB Programmer (CH340)

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = COM4
monitor_port = COM4

upload_protocol = esptool
board_upload.before_reset = no_reset

board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

