; =================================================================
; AquaSentinel-AI: Isolated Hardware Bring-Up Phase
; Stage 05: pH Sensor Module Power-Stage Verification
; =================================================================
; Isolated, self-contained PlatformIO project for hardware bring-up.
; Target Board: NodeMCU ESP-32S (38-pin Dev Module)
; Serial Port : COM3 (Silicon Labs CP2102 USB-UART)
; =================================================================

[env:ph_power_verification]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

upload_port = COM3
monitor_port = COM3

build_flags =
    -D CORE_DEBUG_LEVEL=0
