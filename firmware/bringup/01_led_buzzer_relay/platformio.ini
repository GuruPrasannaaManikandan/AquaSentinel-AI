; =================================================================
; AquaSentinel-AI: Isolated Hardware Bring-Up Phase
; Stage 01: Discrete Actuator Validation (LEDs, Buzzer, 5V Relay)
; =================================================================
; This is an isolated, self-contained PlatformIO configuration.
; It does NOT touch, depend on, or alter the production environment.
; =================================================================

[env:bringup_actuators]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Serial Port Configuration (ESP32 on CP2102)
; upload_port and monitor_port can be overridden or auto-detected (COM3)
upload_port = COM3
monitor_port = COM3

build_flags =
    -D CORE_DEBUG_LEVEL=0
